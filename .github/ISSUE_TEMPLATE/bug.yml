name: Bug report
description: Report unexpected or incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Please provide enough information for someone else to understand
        and reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What steps consistently reproduce the problem?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Include logs, stack traces, screenshots, request payloads,
        related issues, or anything else that may be useful.

  - type: input
    id: application-version
    attributes:
      label: Application version
      description: What version or commit of the bot/client was running?
      placeholder: "e.g. 0.3.1 or commit SHA"
